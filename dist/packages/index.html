<script>
    const menuBtn = document.getElementById("menu-btn");
    const mobileMenu = document.getElementById("mobile-menu");
    const siteHeader = document.getElementById("site-header");
    const bar1 = document.getElementById("bar1");
    const bar2 = document.getElementById("bar2");
    const bar3 = document.getElementById("bar3");

    function closeMobileMenu() {
        menuBtn.classList.remove("open");
        mobileMenu.classList.remove("opacity-100", "pointer-events-auto");
        mobileMenu.classList.add("opacity-0", "pointer-events-none");
        document.body.classList.remove("overflow-hidden");
        siteHeader.classList.remove("bg-navy")
        bar1.classList.remove("bg-cream!");
        bar2.classList.remove("bg-cream!");
        bar3.classList.remove("bg-cream!");

    }

    function toggleMenu() {
        const isOpen = menuBtn.classList.contains("open");
        if (isOpen) {
            closeMobileMenu();
        } else {
            menuBtn.classList.add("open");
            mobileMenu.classList.remove("opacity-0", "pointer-events-none");
            mobileMenu.classList.add("opacity-100", "pointer-events-auto");
            document.body.classList.add("overflow-hidden");
            siteHeader.classList.add("bg-navy")
            bar1.classList.add("bg-cream!");
            bar2.classList.add("bg-cream!");
            bar3.classList.add("bg-cream!");

        }
    }

    menuBtn.addEventListener("click", toggleMenu);

    mobileMenu.querySelectorAll("a").forEach(link => {
        link.addEventListener("click", closeMobileMenu);
    });

    window.addEventListener("resize", () => {
        if (window.innerWidth >= 1024) {
            closeMobileMenu();
        }
    });

</script>
